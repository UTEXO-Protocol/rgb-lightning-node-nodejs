name: Runtime matrix

on:
  workflow_dispatch:
    inputs:
      target:
        description: Exact host consumer target; all is reserved for final platform qualification
        type: choice
        required: true
        default: darwin-arm64
        options: [darwin-arm64, darwin-x64, linux-x64-gnu, linux-arm64-gnu, linux-x64-musl, all]
  workflow_call:
    inputs:
      target:
        description: Exact candidate target or explicit all-platform qualification
        type: string
        required: false
        default: darwin-arm64
    secrets:
      ORG_READ_TOKEN:
        required: true
  pull_request:
    paths:
      - '.github/workflows/runtime-matrix.yml'
      - 'scripts/runtime-matrix.sh'
      - 'scripts/check-linux-runtime*'
      - '.github/docker/runtime-gnu.Dockerfile'
      - 'src/**'
      - 'Cargo*'
      - 'build.rs'
      - 'index*'
      - 'json-boundary.js'
      - 'patches/**'

permissions:
  contents: read

jobs:
  native-runtime:
    if: inputs.target != 'linux-x64-musl'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ inputs.target == 'all' && fromJSON('[{"runner":"macos-15","target":"darwin-arm64"},{"runner":"macos-15-intel","target":"darwin-x64"},{"runner":"ubuntu-22.04","target":"linux-x64-gnu"},{"runner":"ubuntu-24.04-arm","target":"linux-arm64-gnu"}]') || inputs.target == 'darwin-arm64' && fromJSON('[{"runner":"macos-15","target":"darwin-arm64"}]') || inputs.target == 'darwin-x64' && fromJSON('[{"runner":"macos-15-intel","target":"darwin-x64"}]') || inputs.target == 'linux-arm64-gnu' && fromJSON('[{"runner":"ubuntu-24.04-arm","target":"linux-arm64-gnu"}]') || fromJSON('[{"runner":"ubuntu-22.04","target":"linux-x64-gnu"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.target == 'darwin-x64' && 150 || 90 }}
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_RELEASE_DEBUG: 0
      EXPECTED_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate exact requested target
        env:
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          case "$REQUESTED_TARGET" in ""|darwin-arm64|darwin-x64|linux-x64-gnu|linux-arm64-gnu|linux-x64-musl|all) ;; *) exit 1 ;; esac
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: runner.os == 'macOS'
        with:
          node-version: '22'
          cache: npm
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        if: runner.os == 'macOS'
        with:
          toolchain: '1.94.0'
          rustflags: ''
      - run: |
          if [[ "$EXPECTED_TARGET" == "darwin-x64" ]]; then
            mkdir -p "$RUNNER_TEMP/node-runtime-timing"
            exec /usr/bin/time -l -o "$RUNNER_TEMP/node-runtime-timing/darwin-x64.txt" \
              node scripts/with-source-access.js bash scripts/runtime-matrix.sh
          fi
          exec node scripts/with-source-access.js bash scripts/runtime-matrix.sh
        if: runner.os == 'macOS'
        env:
          ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
      - name: Build and execute against the Ubuntu 22.04 baseline
        if: runner.os == 'Linux'
        env:
          ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: |
          docker build -t rln-gnu-runtime -f .github/docker/runtime-gnu.Dockerfile .github/docker
          docker run --rm -v "$PWD:/candidate" -w /candidate \
            -e ORG_READ_TOKEN -e EXPECTED_TARGET -e CARGO_BUILD_JOBS \
            -e CARGO_PROFILE_RELEASE_DEBUG \
            rln-gnu-runtime node scripts/with-source-access.js bash scripts/runtime-matrix.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: runtime-${{ matrix.target }}-${{ github.sha }}
          path: |
            runtime-evidence.json
            packed-consumer-evidence.json
            linux-runtime-compatibility.json
            index-*.provenance.json
            *.tgz
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && matrix.target == 'darwin-x64'
        with:
          name: ci-timing-darwin-x64-${{ github.sha }}
          path: ${{ runner.temp }}/node-runtime-timing/darwin-x64.txt
          if-no-files-found: warn

  musl-runtime:
    if: inputs.target == 'all' || inputs.target == 'linux-x64-musl'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build and execute inside real musl userland
        env:
          ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: |
          docker run --rm -v "$PWD:/candidate" -w /candidate \
            -e ORG_READ_TOKEN \
            -e EXPECTED_TARGET=linux-x64-musl -e CARGO_BUILD_JOBS=2 \
            -e RUSTFLAGS='-C target-feature=-crt-static' \
            rust:1.94.0-alpine3.23 sh -ec '
              apk add --no-cache nodejs npm bash git cmake clang clang-dev make g++ pkgconf openssl-dev perl linux-headers binutils
              export LIBCLANG_PATH=/usr/lib
              node scripts/with-source-access.js bash scripts/runtime-matrix.sh
            '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: runtime-linux-x64-musl-${{ github.sha }}
          path: |
            runtime-evidence.json
            packed-consumer-evidence.json
            linux-runtime-compatibility.json
            index-*.provenance.json
            *.tgz
          if-no-files-found: warn
