name: CI

on:
  pull_request:
  push:
    branches: [main, release/rln-0.15.0-beta.3]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: '1.94.0'
          components: rustfmt
          rustflags: ''
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake clang pkg-config libssl-dev
      - run: npm ci --ignore-scripts
      - run: npm run check:types
      - run: npm run test:unit
      - run: rustfmt --edition 2021 --check src/lib.rs build.rs
      - name: Build exact release graph
        env:
          ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: node scripts/with-source-access.js npm run build:debug
      - run: npm test
      - name: Native adapter tests
        run: node scripts/test-native-adapter.js
      - name: Pack consumer
        run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-contract-${{ github.sha }}
          path: |
            *.tgz
            index-*.provenance.json
          if-no-files-found: error
