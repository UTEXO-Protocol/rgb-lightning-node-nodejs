name: Build Candidate Artifacts (No Publication)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native:
    name: Candidate (${{ matrix.suffix }})
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            suffix: darwin-arm64
            runnable: true
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            suffix: darwin-x64
            runnable: true
          - runner: warp-ubuntu-latest-x64-16x
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64-gnu
            runnable: true
          - runner: warp-ubuntu-latest-arm64-16x
            target: aarch64-unknown-linux-gnu
            suffix: linux-arm64-gnu
            runnable: true
    runs-on: ${{ matrix.runner }}
    env:
      RLN_NODE_TARGET: ${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: '1.94.0'
          target: ${{ matrix.target }}
          rustflags: ''
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang pkg-config libssl-dev
      - run: npm ci --ignore-scripts
      - run: npm run test:unit
      - run: npm run check:types
      - name: Build with scoped source access
        env:
          ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: node scripts/with-source-access.js npm run build
      - name: Runnable target smoke
        if: matrix.runnable
        run: npm test
      - name: Cross-build qualification restriction
        if: '!matrix.runnable'
        run: echo 'Compile-only. Intel runtime qualification remains a release gate.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-${{ matrix.suffix }}-${{ github.sha }}
          path: |
            index-${{ matrix.suffix }}.node
            index-${{ matrix.suffix }}.provenance.json
          if-no-files-found: error

  build-musl:
    runs-on: warp-ubuntu-latest-x64-16x
    timeout-minutes: 120
    container:
      image: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
    env:
      RLN_NODE_TARGET: linux-x64-musl
      CC: gcc
      CXX: g++
      RUSTFLAGS: '-C target-feature=-crt-static'
      LIBCLANG_PATH: /usr/lib
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build prerequisites
        run: apk add --no-cache --force-overwrite bash git perl cmake clang llvm-dev openssl-dev sqlite-dev build-base nodejs npm
      - name: Pinned toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup target add --toolchain 1.94.0 x86_64-unknown-linux-musl
      - name: Build and verify
        shell: bash
        env:
          ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: |
          set -euo pipefail
          export PATH="/usr/bin:$PATH"
          npm ci --ignore-scripts
          npm run test:unit
          npm run check:types
          node scripts/with-source-access.js npm run build
          npm test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-linux-x64-musl-${{ github.sha }}
          path: |
            index-linux-x64-musl.node
            index-linux-x64-musl.provenance.json
          if-no-files-found: error
