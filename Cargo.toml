[package]
name = "rln-node"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Node-API bindings for rgb-lightning-node (RGB Lightning Node)"
publish = false

# napi-rs builds a cdylib (becomes <crate>.node at install time).
[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "2.16"

# Path dep for local builds; release prebuilds ship the compiled `.node`
# via GitHub Releases (see scripts/download-libs.sh) so consumers don't
# need this sibling checkout.
rln-c-ffi = { path = ".native-source/bindings/c-ffi" }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
opt-level = 3
strip = "symbols"
codegen-units = 1

# Mirror the parent crate's `[patch.crates-io]` block so registry crates
# resolve to the same revisions the parent is pinned against. Without
# this, `vls-core` resolves to a crates.io version that lacks the
# `rgb-commitment-compat` feature signer-external relies on, and the
# whole graph fails to lock. Must be kept in sync with
# `rgb-lightning-node/bindings/c-ffi/Cargo.toml`.
#
# `lightning` MUST resolve to the SAME rust-lightning the parent crate
# builds — the pinned submodule at `rgb-lightning-node/rust-lightning`.
# The parent's v0.5.2 source uses fork APIs (e.g. `RgbInfo.batch_transfer_idx`)
# that only exist at the submodule commit; a separate `rmn-boiko` branch tip
# drifts behind and fails to compile the parent source.
[patch.crates-io]
lightning                      = { path = ".native-source/rust-lightning/lightning" }
lightning-background-processor = { path = ".native-source/rust-lightning/lightning-background-processor" }
lightning-block-sync           = { path = ".native-source/rust-lightning/lightning-block-sync" }
lightning-dns-resolver         = { path = ".native-source/rust-lightning/lightning-dns-resolver" }
lightning-invoice              = { path = ".native-source/rust-lightning/lightning-invoice" }
lightning-net-tokio            = { path = ".native-source/rust-lightning/lightning-net-tokio" }
lightning-persister            = { path = ".native-source/rust-lightning/lightning-persister" }
lightning-rapid-gossip-sync    = { path = ".native-source/rust-lightning/lightning-rapid-gossip-sync" }
vls-core                       = { git = "https://github.com/UTEXO-Protocol/vls-core.git", branch = "feat/rgb-compatibility" }
vls-protocol-signer            = { git = "https://github.com/UTEXO-Protocol/vls-protocol-signer.git", branch = "feat/rgb-compatibility" }
